<!DOCTYPE html>
<html lang="zh-CN" class="fs-2">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FCF7F0">
  <meta name="description" content="乐龄聆听计划：一句一句地听，听完说一说，最后才揭晓。为长辈设计的音乐聆听引导产品。">
  <title>乐龄聆听计划</title>
  <link rel="stylesheet" href="ui/style.css">
</head>
<body>
  <div class="app">
    <!-- 顶栏：字号、朗读、陪听、大屏，都在手边 -->
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true">🎵</span><span>乐龄聆听计划</span></div>
      <div class="tb-tools">
        <div class="fs-bar" id="fsBar" role="group" aria-label="字号大小">
          <span class="lb">字</span>
          <button type="button" data-fs="1" aria-label="字号：正常">小</button>
          <button type="button" data-fs="2" aria-label="字号：大">中</button>
          <button type="button" data-fs="3" aria-label="字号：特大">大</button>
        </div>
        <button type="button" class="tb-btn" id="voiceBtn" aria-pressed="true">🔊 朗读</button>
        <button type="button" class="tb-btn" id="cpBtn" aria-pressed="false">👥 陪听</button>
        <button type="button" class="tb-btn" id="bigBtn" aria-pressed="false">📺 大屏</button>
        <button type="button" class="tb-btn hidden" id="homeBtn">🏠 首页</button>
      </div>
    </header>

    <!-- 播放器坞：真正在放的，是 B 站里的录音 -->
    <div class="dock" id="dock"></div>

    <!-- 陪听 / 大屏提示条 -->
    <div class="companion" id="companion"></div>

    <!-- 当前这一屏 -->
    <main class="screen" id="screen" tabindex="-1"></main>

    <!-- 读屏播报区（视觉上不显示，读屏软件会念出来） -->
    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
  </div>

  <!-- 我的聆听（历史记录） -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-in">
      <div class="sheet-head">
        <h3 id="sheetTitle">我的聆听</h3>
        <button type="button" class="sheet-close" id="sheetClose" aria-label="关闭">✕</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- 曲库 → 播放器 → 引导脚本 → 向导 → 朗读/陪听 → 记录 → 屏幕 -->
  <script src="data/catalog.js"></script>
  <script src="core/player.js"></script>
  <script src="core/guide.js"></script>
  <script src="core/wizard.js"></script>
  <script src="a11y/voice.js"></script>
  <script src="a11y/companion.js"></script>
  <script src="store/records.js"></script>
  <script src="ui/screens.js"></script>
</body>
</html>
